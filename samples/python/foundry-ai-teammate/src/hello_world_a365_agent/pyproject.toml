[project]
name = "hello-world-a365-agent"
version = "0.1.0"
description = "Foundry A365 Agent - Python sample (Hello World)"
authors = [
    { name = "Microsoft", email = "support@microsoft.com" },
]
requires-python = ">=3.11"
dependencies = [
    # Microsoft 365 Agents SDK (Python)
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-hosting-core",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",

    # Microsoft Agent 365 SDK extensions
    "microsoft_agents_a365_notifications >= 0.1.0",

    # HTTP server / client
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",

    # Auth
    "azure-identity>=1.17.0",
    "msal>=1.28.0",
    "PyJWT>=2.8.0",

    # Misc
    "python-dotenv>=1.0.0",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]
microsoft_agents_a365_notifications = { index = "pypi" }

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = []

[tool.setuptools.packages.find]
where = ["."]
include = ["hello_world_a365_agent*"]
exclude = ["build*", "dist*", "venv*", ".venv*"]
