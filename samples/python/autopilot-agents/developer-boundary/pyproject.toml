[project]
name = "agent"
version = "0.1.0"
description = "Microsoft 365 agent with provisioned Foundry infrastructure and developer boundaries."
authors = [{ name = "Microsoft", email = "support@microsoft.com" }]
requires-python = ">=3.11"
dependencies = [
    "microsoft-agents-hosting-aiohttp",
    "microsoft-agents-hosting-core",
    "microsoft-agents-authentication-msal",
    "microsoft-agents-activity",
    "microsoft-opentelemetry[hosting]>=1.3.8",
    "aiohttp>=3.10",
    "azure-ai-projects>=2.3.0",
    "azure-identity>=1.19",
    "httpx>=0.28.1",
]

[project.scripts]
agent = "agent.__main__:main"

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]
