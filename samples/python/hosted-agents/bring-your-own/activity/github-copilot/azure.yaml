# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: github-copilot-activity
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 20
      - name: gpt-4o
        model:
          format: OpenAI
          name: gpt-4o
          version: '2024-08-06'
        sku:
          name: GlobalStandard
          capacity: 50
  amandaf-lr-icons:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Activity Protocol
        - Bring Your Own
        - GitHub Copilot SDK
        - Python
    project: src/github-copilot-activity
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: amandaf-lr-icons
    displayName: Research test (Python, Activity)
    description: >
      Test build of the GitHub Copilot activity sample. Adds real web research
      (search_web, Foundry's built-in web_search tool) and research instructions
      so a request runs for several minutes and ends with a cited Word report,
      to test how Teams and Microsoft 365 Copilot show replies that take longer
      than two minutes, plus custom app icons.
    protocols:
      - protocol: activity
        version: 2.0.0
    agentEndpoint:
      protocols:
        - activity
      authorizationSchemes:
        - type: BotServiceRbac
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5-mini}
      SEARCH_MODEL_DEPLOYMENT_NAME: ${SEARCH_MODEL_DEPLOYMENT_NAME=gpt-4o}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
