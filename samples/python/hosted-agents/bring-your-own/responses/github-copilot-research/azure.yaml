# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.27.1'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.9'
name: github-copilot-research
services:
  ai-project:
    host: azure.ai.project
    deployments:
      - name: gpt-5-mini
        model:
          format: OpenAI
          name: gpt-5-mini
          version: '2025-08-07'
        sku:
          name: GlobalStandard
          capacity: 20
      - name: gpt-4o
        model:
          format: OpenAI
          name: gpt-4o
          version: '2024-08-06'
        sku:
          name: GlobalStandard
          capacity: 50
  amandaf-lr-responses:
    host: azure.ai.agent
    metadata:
      tags:
        - AI Agent Hosting
        - Responses Protocol
        - Bring Your Own
        - GitHub Copilot SDK
        - Python
    project: src/github-copilot-research
    language: python
    codeConfiguration:
      runtime: python_3_13
      entryPoint: main.py
    uses:
      - ai-project
    kind: hosted
    name: amandaf-lr-responses
    displayName: Research test (Python, Responses)
    description: >
      Test build: the same GitHub Copilot SDK research agent as amandaf-lr-icons,
      but its code speaks only the Responses protocol. Publishing to Teams and
      Microsoft 365 Copilot adds the Activity protocol, and Foundry translates
      between the two, to compare that experience with the Activity build.
    protocols:
      - protocol: responses
        version: 2.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME=gpt-5-mini}
      SEARCH_MODEL_DEPLOYMENT_NAME: ${SEARCH_MODEL_DEPLOYMENT_NAME=gpt-4o}
    container:
      resources:
        cpu: '1'
        memory: 2Gi
infra:
  provider: microsoft.foundry
