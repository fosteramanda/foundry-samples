# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

requiredVersions:
  azd: '>=1.32.0'
  extensions:
    azure.ai.agents: '>=1.0.0-beta.13'
name: voice-live-bridge-basic-dotnet
services:
  ai-project:
    host: azure.ai.project
    # Fresh-project default used by azd provision. To reuse an existing project
    # and model deployment, configure the project environment as documented in
    # README.md and run azd deploy without azd provision or azd up.
    deployments:
      - name: gpt-5.4-mini
        model:
          format: OpenAI
          name: gpt-5.4-mini
          version: '2026-03-17'
        sku:
          name: GlobalStandard
          capacity: 10
  voice-live-bridge-basic-dotnet:
    host: azure.ai.agent
    metadata:
      voiceLiveCompatible: "true"
      bridgeProtocolVersion: "1.0"
      tags:
        - AI Agent Hosting
        - Voice Live Bridge
        - WebSocket Protocol
        - invocations_ws
        - Bring Your Own
        - .NET
    project: src/voice-live-bridge-basic-dotnet
    language: csharp
    codeConfiguration:
      runtime: dotnet_10
      entryPoint: VoiceLiveBridgeBasic.dll
    uses:
      - ai-project
    kind: hosted
    name: voice-live-bridge-basic-dotnet
    displayName: Voice Live Bridge — Basic .NET
    description: A hosted text agent that implements Voice Live Bridge Protocol 1.0 with typed AgentServer callbacks and streams text from a Foundry model through the Responses API.
    protocols:
      - protocol: invocations_ws
        version: 1.0.0
    env:
      AZURE_AI_MODEL_DEPLOYMENT_NAME: ${AZURE_AI_MODEL_DEPLOYMENT_NAME}
      AZURE_OPENAI_MAX_OUTPUT_TOKENS: '512'
    container:
      resources:
        cpu: '1'
        memory: 2Gi
  voice-live-bridge-basic-dotnet-voice:
    host: azure.ai.agent
    kind: voice
    name: voice-live-bridge-basic-dotnet-voice
    uses:
      - ai-project
      - voice-live-bridge-basic-dotnet
    conversationEngine:
      type: hosted_agent
      name: voice-live-bridge-basic-dotnet
    store: false
    audio:
      input:
        format:
          type: audio/pcm
          rate: 24000
        turnDetection:
          type: server_vad
          threshold: 0.5
          prefixPaddingMs: 300
          silenceDurationMs: 500
        transcription:
          model: azure-speech
      output:
        format:
          type: audio/pcm
          rate: 24000
        voice:
          type: azure-standard
          name: en-US-AvaNeural
    outputModalities:
      - audio
    greeting:
      type: template
      text: Hello! How can I help you today?
infra:
  provider: microsoft.foundry
